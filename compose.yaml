services:
  db:
    image: docker.io/library/mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: desarrimage
      MARIADB_USER: desarrimage
      MARIADB_PASSWORD: desarrimage-dev
      MARIADB_ROOT_PASSWORD: desarrimage-root-dev
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    environment:
      APP_ENV: development
      DESARRIMAGE_DB_HOST: db
      DESARRIMAGE_DB_PORT: 3306
      DESARRIMAGE_DB_NAME: desarrimage
      DESARRIMAGE_DB_USER: desarrimage
      DESARRIMAGE_DB_PASS: desarrimage-dev
      CORS_ORIGIN: http://localhost:5173
    volumes:
      - ./api:/var/www/html/api
      - ./data:/var/www/html/data
      - api_vendor:/var/www/html/api/vendor
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "php", "-r", "exit(file_get_contents('http://127.0.0.1/api/health') === false ? 1 : 0);"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  client:
    build:
      context: .
      dockerfile: Dockerfile
      target: client
    environment:
      VITE_API_PROXY_TARGET: http://api:80
      VITE_APP_VERSION: ${VITE_APP_VERSION:-0.1.0}
    volumes:
      - ./client:/app
      - ./api/openapi.yaml:/app/spec/openapi.yaml:ro
      - client_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api

volumes:
  api_vendor:
  client_node_modules:
  db_data:
