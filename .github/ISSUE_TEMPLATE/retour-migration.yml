name: Retour de migration réelle
description: Partager un scénario testé sur le terrain, avec ses preuves et ses difficultés
title: "[Migration] "
labels: [migration, field-report]
body:
  - type: input
    id: guide
    attributes:
      label: Guide concerné
      placeholder: quitter-google-drive
    validations:
      required: true
  - type: textarea
    id: contexte
    attributes:
      label: Contexte de la migration
      description: Organisation anonymisée, nombre d’utilisateurs, volume, dates, source et destination.
    validations:
      required: true
  - type: textarea
    id: deroulement
    attributes:
      label: Étapes et durée réelle
      description: Décrivez ce qui a été fait et le temps passé en jours-homme.
    validations:
      required: true
  - type: textarea
    id: problemes
    attributes:
      label: Problèmes rencontrés et parades
      description: Incluez erreurs, pertes fonctionnelles et retours arrière éventuels.
    validations:
      required: true
  - type: textarea
    id: preuves
    attributes:
      label: Preuves anonymisées
      description: Liens vers logs, captures, exports ou documents. Aucun secret ni donnée personnelle.
    validations:
      required: true
  - type: input
    id: affiliation
    attributes:
      label: Affiliation éventuelle
    validations:
      required: true
