name: Corriger une donnée
description: Proposer une correction précise sur un produit, une cellule, un prix ou une source
title: "[Data] "
labels: [data]
body:
  - type: input
    id: guide
    attributes:
      label: Guide ou produit concerné
      placeholder: quitter-google-drive / nextcloud
    validations:
      required: true
  - type: input
    id: cellule
    attributes:
      label: Cellule exacte
      placeholder: Critère, destination, prix, risque ou étape
    validations:
      required: true
  - type: textarea
    id: probleme
    attributes:
      label: Problème constaté
      description: Citez le texte actuel et expliquez ce qui est faux ou obsolète.
    validations:
      required: true
  - type: textarea
    id: proposition
    attributes:
      label: Correction proposée et source officielle
      description: Ajoutez le texte proposé, la date et l’URL de vérification.
    validations:
      required: true
  - type: input
    id: affiliation
    attributes:
      label: Affiliation éventuelle
      description: Employeur, fournisseur, partenariat ou « aucune »
    validations:
      required: true
