<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#102a2d" />
    <meta name="description" content="Désarrimage vous aide à quitter les outils numériques extra-européens avec des alternatives françaises et européennes et des guides de migration concrets." />
    <script>
      try {
        const savedTheme = localStorage.getItem('desarrimage-theme')
        const requestedTheme = new URLSearchParams(window.location.search).get('theme')
        const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = ['light', 'dark'].includes(requestedTheme) ? requestedTheme : (savedTheme || systemTheme)
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
    <title>Désarrimage — Changez de cap, pas d’habitudes</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
