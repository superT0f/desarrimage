    <path d="M565 88v12m-6-6h12" stroke="#176d68" stroke-width="1.5"/>

    <text x="144" y="157" fill="#176d68" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1.8">DE L’ANCIEN MONDE</text>
    <text x="144" y="185" fill="#102f32" font-family="Arial, sans-serif" font-size="23" font-weight="700">Vos données,</text>
    <text x="144" y="211" fill="#102f32" font-family="Georgia, serif" font-size="25" font-style="italic">sans les chaînes.</text>

    <g transform="translate(457 147)">
