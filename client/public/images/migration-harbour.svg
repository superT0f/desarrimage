    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#102f32" flood-opacity=".13"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 6 3 0 6" fill="none" stroke="#ed7353" stroke-width="1.5"/>
    </marker>
  </defs>

  <circle cx="354" cy="309" r="263" fill="#e9e6dc"/>
  <circle cx="354" cy="309" r="230" fill="none" stroke="#176d68" stroke-opacity=".12" stroke-dasharray="3 9"/>
  <path d="M65 477c110-62 168-27 260 9 95 37 182 43 290-18" fill="none" stroke="#176d68" stroke-opacity=".18" stroke-width="2"/>
  <path d="M54 494c110-62 176-23 267 13 94 37 179 36 289-23" fill="none" stroke="#176d68" stroke-opacity=".1" stroke-width="2"/>

