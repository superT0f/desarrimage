<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 620" role="img" aria-labelledby="title desc">
  <title id="title">Le plan de traversée Désarrimage</title>
  <desc id="desc">Une carte de migration relie un service actuel à une alternative européenne, entourée de conteneurs de données et d’un bateau.</desc>
  <defs>
