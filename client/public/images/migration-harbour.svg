    <text x="145" y="395" fill="#176d68" font-family="Arial, sans-serif" font-size="8" font-weight="700" letter-spacing="1.5">VOTRE ROUTE, ÉTAPE PAR ÉTAPE</text>
    <g font-family="Arial, sans-serif">
      <g transform="translate(145 414)">
        <circle cx="13" cy="13" r="12" fill="#176d68"/>
        <path d="m8 13 3 3 7-7" fill="none" stroke="#fffdf8" stroke-width="2"/>
        <text x="38" y="11" fill="#102f32" font-size="10" font-weight="700">Inventorier les données</text>
        <text x="38" y="25" fill="#62736f" font-size="8">Savoir ce qui part, ce qui reste</text>
        <text x="395" y="17" text-anchor="end" fill="#62736f" font-size="8">01</text>
      </g>
      <path d="M145 456h415" stroke="#d9dfd8" stroke-dasharray="3 4"/>
      <g transform="translate(145 469)">
        <circle cx="13" cy="13" r="12" fill="#fffdf8" stroke="#176d68"/>
        <text x="13" y="17" text-anchor="middle" fill="#176d68" font-size="9">2</text>
        <text x="38" y="11" fill="#102f32" font-size="10" font-weight="700">Tester la traversée</text>
        <text x="38" y="25" fill="#62736f" font-size="8">Un pilote, puis le retour arrière</text>
        <text x="395" y="17" text-anchor="end" fill="#62736f" font-size="8">02</text>
      </g>
    </g>
