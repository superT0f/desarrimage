    <path d="M184-40v45m0-43 26 12h-26" fill="#f2eee4" stroke="#102f32" stroke-width="2"/>
    <path d="M-9 62c22-12 41 12 63 0s41 12 63 0 41 12 63 0 41 12 63 0 41 12 63 0" fill="none" stroke="#176d68" stroke-width="2"/>
  </g>

  <g fill="#ed7353">
