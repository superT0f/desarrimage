<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Documentation OpenAPI publique de Désarrimage : catalogue, guides de migration, coûts et risques." />
    <title>API publique — Désarrimage</title>
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
    <link rel="stylesheet" href="/swagger-assets/swagger-ui.css" />
    <style>
      body { margin: 0; background: #fffdf8; }
      .docs-topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 16px 5%; background: #102f32; }
      .docs-topbar img { width: 205px; height: auto; }
      .docs-topbar a { color: #b8cac6; font: 600 13px/1.4 "Avenir Next", "Segoe UI", sans-serif; text-decoration: none; }
      .docs-topbar a:hover { color: #ed7353; }
      .docs-intro { padding: 24px 5%; background: #f2eee4; color: #102f32; font: 400 15px/1.7 "Avenir Next", "Segoe UI", sans-serif; }
      .docs-intro strong { display: block; margin-bottom: 4px; font-size: 20px; }
      .docs-intro p { max-width: 900px; margin: 0; }
      .docs-intro code { padding: 2px 5px; background: #dcebe6; color: #176d68; }
      #swagger-ui { max-width: 1400px; margin: 0 auto; }
      .swagger-ui .topbar { display: none; }
      .swagger-ui .info .title { font-family: "Avenir Next", "Segoe UI", sans-serif; }
      @media (max-width: 600px) { .docs-topbar { align-items: flex-start; flex-direction: column; } .docs-topbar img { width: 180px; } }
    </style>
  </head>
  <body>
    <header class="docs-topbar">
      <a href="/" aria-label="Retour à Désarrimage"><img src="/images/logo-light.svg" alt="Désarrimage" /></a>
      <a href="/">← Retour à la vitrine</a>
    </header>
    <div class="docs-intro">
      <strong>⚓ L’API publique, sans clé et sans écriture anonyme.</strong>
      <p>Catalogue, guides, comparaisons, coûts et risques sont disponibles en lecture seule. Les montants sont en <code>centimes</code>, les charges en <code>jours-homme</code>. Les contributions passent par <a href="https://github.com/superT0f/desarrimage">GitHub</a>.</p>
    </div>
    <div id="swagger-ui"></div>
    <script src="/swagger-assets/swagger-ui-bundle.js"></script>
    <script src="/swagger-assets/swagger-ui-standalone-preset.js"></script>
    <script>
      window.onload = () => {
        window.ui = SwaggerUIBundle({
          url: '/api/openapi.yaml',
          dom_id: '#swagger-ui',
          deepLinking: true,
          docExpansion: 'none',
          defaultModelsExpandDepth: 0,
          supportedSubmitMethods: ['get'],
          presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
          plugins: [SwaggerUIBundle.plugins.DownloadUrl],
          layout: 'StandaloneLayout',
        })
      }
    </script>
  </body>
</html>
